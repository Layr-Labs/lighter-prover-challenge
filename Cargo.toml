[workspace]
members = ["circuit", "bench", "desertexit/circuits"]
exclude = ["vendor/plonky2"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Business Source License 1.1"

[workspace.dependencies]
ahash = { version = "0.8.7", default-features = false, features = [
  "compile-time-rng",
] } # NOTE: Be sure to keep this version the same as the dependency in `hashbrown`.
anyhow = { version = "1.0.40", default-features = false }
hashbrown = { version = "0.14.3", default-features = false, features = [
  "ahash",
  "serde",
] } # NOTE: When upgrading, see `ahash` dependency.
itertools = { version = "0.13.0", default-features = false }
# Ranked workers do not consume application logs. Keep logging available in
# debug/test builds, but compile every log call out of release binaries so the
# proving hot path does not repeatedly load and compare the global max level.
log = { version = "0.4.14", default-features = false, features = [
  "release_max_level_off",
] }
num = { version = "0.4", default-features = false, features = [
  "rand",
  "serde",
] }
bincode = "1.3.3"
rand = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_with = { version = "3.8.3", features = ["hex"] }
serde_json = { version = "1.0" }
static_assertions = { version = "1.1.0", default-features = false }
hex = { version = "0.4.3" }
sha2 = { version = "0.10.6" }
unroll = { version = "0.1.5", default-features = false }
rayon = "1.5.1"
plonky2 = { path = "vendor/plonky2/plonky2", package = "plonky2", default-features = false, features = [
 "gate_testing",
 "parallel",
 "rand_chacha",
 "std",
] }
lazy_static = "1.4.0"
env_logger = "0.11.3"
ff = { package = "ff", version = "0.13", features = ["derive"] }
paste = "1.0"
clap = { version = "4.5.21", features = ["derive"] }
clap_derive = { version = "4.0.0-rc.1" }

# Dev dependencies
tiny-keccak = { version = "2.0.2", features = ["keccak"] }

[profile.release]
incremental = false
lto = "fat"
codegen-units = 1
panic = "abort"
# The score is the sum of worker process lifetimes, and each spawn validates the
# binary's code signature over its whole mapped size. Debug symbols and the
# local symbol table are never read by anything on the scored path — nothing
# unwinds (`panic = "abort"`) and no backtrace is printed — so they are pure
# per-spawn weight. Stripping them cannot change what any instruction does.
strip = "symbols"

# bench/build.rs constructs and serializes the five startup circuits at
# compile time. Build scripts default to opt-level 0, which would turn that
# few-second construction into minutes of untimed-but-annoying work; compile
# the build-dependency graph optimized instead.
[profile.release.build-override]
opt-level = 3

[profile.dev.build-override]
opt-level = 3

